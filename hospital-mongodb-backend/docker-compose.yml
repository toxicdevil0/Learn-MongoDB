services:
  mongo:
    image: mongo:7
    command: ["mongod","--replSet","rs0","--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: .
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/hospital_management?replicaSet=rs0
    depends_on: [mongo]
volumes:
  mongo_data: